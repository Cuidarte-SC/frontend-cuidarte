# Cuidarte+ · Servidor del frontend
# Sirve la SPA por HTTPS y reenvía /api a la API (NFR-SEG-1: comunicaciones cifradas)

# HTTP -> HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;            # no revela la versión de nginx
    client_max_body_size 11m;     # documentos de hasta 10 MB (RF-4)

    # Cabeceras de seguridad (OWASP). Ningún location usa add_header para no anularlas.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root  /usr/share/nginx/html;
    index index.html;

    # API (contenedor "api" en la red de Docker)
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Archivos estáticos con hash: caché larga (NFR-PERF-2)
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri /index.html;
    }
}